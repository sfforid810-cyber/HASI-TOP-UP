<style>
:root{--bg:#f5f8ff;--bd:#e1e8f5;--v:#2563eb;--v2:#3b82f6;--tx:#0f172a;--mu:#666b85;--g:linear-gradient(135deg,#3b82f6,#1d4ed8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,"Noto Sans Bengali",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
.top small{color:var(--mu);font-size:12px;display:block}
.tabs{max-width:1100px;margin:0 auto;padding:0 10px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--bd);border-radius:99px;background:#fff;font-weight:700;color:var(--mu);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--g);border-color:transparent;color:#fff;box-shadow:0 8px 16px -8px rgba(37,99,235,.7)}
.tabs i{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
main{max-width:1100px;margin:0 auto;padding:14px 14px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar h2{font-size:19px;font-weight:800;margin-right:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border:1px solid var(--bd);border-radius:99px;background:#fff;font-weight:700;font-size:13px;color:var(--mu);cursor:pointer}
.chip.on{background:#e8f0ff;border-color:#c9daff;color:var(--v)}
.inp,select.inp,textarea.inp{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid #bcd0fb;background:#fff;outline:none}
textarea.inp{min-height:90px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.bar .inp{width:auto;flex:1;min-width:150px;max-width:340px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.gh{background:#eef3ff;color:var(--v)}
.btn.ok{background:#16a34a}.btn.no{background:#dc2626}.btn.wr{background:#f59e0b}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:16px;border-radius:18px;background:#fff;border:1px solid var(--bd);cursor:pointer;box-shadow:0 8px 20px -16px rgba(20,40,90,.5)}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--v);letter-spacing:-.5px}
.stat span{font-size:12.5px;color:var(--mu);font-weight:600}
.list{display:grid;gap:10px}
@media(min-width:800px){.list{grid-template-columns:1fr 1fr}}
.card{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--bd);box-shadow:0 6px 18px -14px rgba(20,40,90,.4);min-width:0}
.card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card b{font-size:14.5px;font-weight:800;line-height:1.5;word-break:break-word}
.card small,.card div.sm{display:block;margin-top:3px;font-size:12.5px;color:var(--mu);line-height:1.65;word-break:break-word}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.price{font-weight:800;color:var(--v);white-space:nowrap}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.st.p{background:#fff7e6;color:#b54708}.st.ok{background:#ecfdf3;color:#067647}.st.no{background:#fef3f2;color:#b42318}
.code{margin-top:8px;padding:8px 10px;border-radius:10px;background:#eff5ff;border:1px dashed #93c5fd;font-weight:700;font-size:13px;word-break:break-all}
.row{display:flex;gap:12px;align-items:center}
.row img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#e8f0fe;flex:none;border:1px solid var(--bd)}
.empty{padding:50px 10px;text-align:center;color:var(--mu)}
.panel{padding:16px;border-radius:18px;background:#fff;border:1px solid var(--bd);margin-bottom:12px}
.fld{margin-bottom:12px}.fld label{display:block;margin-bottom:6px;font-weight:700;font-size:13px}

.ck{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}.ck input{width:18px;height:18px}

.logo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:700px){.logo-grid{grid-template-columns:repeat(4,1fr)}}
.logo-box{border:1px solid var(--bd);border-radius:16px;padding:12px;background:#f7faff;text-align:center}
.logo-box b{display:block;font-size:12.5px;margin-bottom:8px;min-height:32px}
.logo-prev{width:84px;height:84px;margin:0 auto 10px;border-radius:16px;background:#fff;border:1.5px dashed #bcd0fb;display:grid;place-items:center;overflow:hidden;color:#94a3b8;font-size:11px}
.logo-prev.round{border-radius:50%}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.logo-prev.round img{object-fit:cover}
.logo-box .acts{display:flex;gap:6px;justify-content:center}
.grid2{display:grid;gap:0 12px}@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.mask{position:fixed;inset:0;z-index:50;background:rgba(10,22,55,.55);display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.box{width:min(100%,460px);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}
.box h3{font-size:17px;font-weight:800;margin-bottom:14px}
.box .acts{display:flex;gap:8px;margin-top:6px}.box .acts .btn{flex:1}
.err{color:#b42318;font-size:13px;font-weight:600;margin-top:8px;min-height:0}
.login{max-width:380px;margin:12vh auto 0;padding:22px}
.login h1{font-size:22px;font-weight:800;margin-bottom:4px}.login p{color:var(--mu);font-size:13px;margin-bottom:16px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;max-width:calc(100% - 30px);padding:11px 18px;border-radius:12px;background:#0f172a;color:#fff;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pass-logo{width:62px;height:62px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;background:linear-gradient(135deg,#60a5fa,#1d4ed8);box-shadow:0 12px 28px #2563eb44}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:20px 0 16px;min-height:15px}.pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #2563eb;background:#fff}.pin-dot.filled{background:#2563eb;box-shadow:0 0 0 4px #2563eb18}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}.keypad button{height:54px;border:1px solid #dbe7ff;border-radius:15px;background:linear-gradient(180deg,#fff,#f0f5ff);font-size:21px;font-weight:800;color:#1d4ed8;box-shadow:0 4px 10px #1e40af0d;cursor:pointer;touch-action:manipulation}.keypad button:active{transform:scale(.96);background:#dbeafe}.keypad .key-muted{color:#64748b}.keypad .key-enter{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
.btn,.chip,.tabs button,.stat,.keypad button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn:active,.chip:active{transform:scale(.97)}
</style>
<style>
/* Hasi premium password-reset panel */
.reset-premium{position:relative;overflow:hidden;border-radius:20px!important;border:1px solid rgba(99,142,235,.2)!important;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(241,246,255,.96))!important;box-shadow:0 16px 38px rgba(37,74,150,.09)}
.reset-premium:before{content:"";position:absolute;top:-70px;right:-55px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(89,143,255,.13),transparent 68%);pointer-events:none}
#resetResult{border-radius:18px!important;background:linear-gradient(145deg,#f0f6ff,#e8f0ff)!important;border:1px solid #c8dcff!important;box-shadow:inset 0 1px 0 #fff,0 10px 24px rgba(37,99,235,.08);animation:resetReveal .3s ease both}
#resetCodeText{font-variant-numeric:tabular-nums;text-shadow:0 4px 14px rgba(29,78,216,.12)}
#makeResetCode,#copyResetCode{transition:transform .2s ease,box-shadow .2s ease}

@keyframes resetReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#resetResult,#makeResetCode,#copyResetCode{animation:none!important;transition:none!important}}
</style><style>
.rc{position:relative;overflow:hidden}
.rc-new{animation:rcIn .45s cubic-bezier(.2,.9,.25,1) both}
.rc-new .rc-code span{animation:rcDigit .5s cubic-bezier(.2,.9,.25,1.4) both}
@keyframes rcIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.rc-live{border-color:#bcd0fb;box-shadow:0 12px 28px -16px rgba(37,99,235,.55)}
.rc-live:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#3b82f6,#8b5cf6);animation:rcPulse 1.8s ease-in-out infinite}
@keyframes rcPulse{50%{opacity:.35}}
.rc-old{opacity:.62}
.rc-code{display:flex;justify-content:center;gap:7px;margin:12px 0 6px;cursor:pointer}
.rc-code span{width:38px;height:48px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(#fff,#eaf1ff);border:1px solid #c9daff;font-size:24px;font-weight:900;color:#1d4ed8;box-shadow:0 6px 14px -8px rgba(29,78,216,.5)}
@keyframes rcDigit{from{opacity:0;transform:translateY(10px) scale(.6)}to{opacity:1;transform:none}}
.rc-code:active span{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){.rc,.rc-live:before,.rc-code span{animation:none!important}}
</style>
</head>

<script>
function __adminMain(){

var CFG=window.FIREBASE_CONFIG||{};
var ADMINS=(window.ADMIN_EMAILS||[]).map(function(x){return String(x).toLowerCase()});
if(!(window.firebase&&CFG.apiKey&&String(CFG.apiKey).indexOf('PASTE')<0)){
  $('gate').hidden=false; $('gateMsg').textContent='⚠️ Firebase config যাচাই করুন।'; return;
}

function submitPin(){
  $('gErr').textContent='';
  if(PIN.length!==6){$('gErr').textContent='৬ সংখ্যার পাসকোড দিন';return}
  if(PIN!=='623400'){PIN='';paintPin();$('gErr').textContent='পাসকোড ভুল হয়েছে';return}
  PIN='';paintPin();pinOk=true;
  var u=auth.currentUser;
  if(u && ADMINS.indexOf((u.email||'').toLowerCase())>=0){$('gate').hidden=true;$('app').hidden=false;$('adm').textContent=u.email;start();return}
  $('gErr').textContent='এই ডিভাইসে Firebase Admin সেশন নেই। প্রথমবারের জন্য নিচের Firebase Login দরকার।';
  $('firebaseLoginBox').hidden=false;
}
$('keypad').addEventListener('click',function(e){var b=e.target.closest('button[data-pin]');if(!b)return;var k=b.getAttribute('data-pin');if(k==='clear')PIN=PIN.slice(0,-1);else if(k==='enter'){submitPin();return}else if(PIN.length<6)PIN+=k;paintPin();if(PIN.length===6)submitPin()});

  this.disabled=false;
};

$('out').onclick=function(){pinOk=false;started=false;unsubs.forEach(function(f){try{f()}catch(e){}});unsubs=[];auth.signOut()};

auth.onAuthStateChanged(function(u){

// ---------- password reset by mobile number: the panel makes the 6-digit code, you send it on WhatsApp ----------
var vLoaded=false,usersLoaded=false,handledReq={},seenRc={},lastErrT=0;
function d10(v){return String(v||'').replace(/\D/g,'').slice(-10)}
function genCode(){var x=new Uint32Array(1);crypto.getRandomValues(x);return String(100000+x[0]%900000)}
function rState(r){
  if(tms(r.expiresAt)<=Date.now())return 'expired';
  if(vLoaded&&!D.verifs.some(function(v){return v.id===r.id+'_'+r.code}))return 'used';
  return 'active';
}
function leftTxt(r){var ms=tms(r.expiresAt)-Date.now();if(ms<=0)return 'মেয়াদ শেষ';var m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+':'+('0'+s).slice(-2)}
function waLink(r){
  var d=String(r.phone||'').replace(/\D/g,'');
  if(d.length===11&&d.charAt(0)==='0')d='88'+d; else if(d.length===10)d='880'+d;
  var txt='আপনার Hasi পাসওয়ার্ড রিসেট কোড: '+r.code+'\nকোডটি ১৫ মিনিট বৈধ। কাউকে শেয়ার করবেন না।';
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(txt);
}
// New requests from the user site get a code automatically while the admin panel is open.
function makeResetFor(reqId,phoneRaw,u,markReq){
  var code=genCode(),exp=firebase.firestore.Timestamp.fromMillis(Date.now()+15*60000),b=db.batch(),old=find('resets',reqId);
  if(old&&old.code)b.delete(db.collection('resetVerify').doc(reqId+'_'+old.code));
  b.set(db.collection('resetCodes').doc(reqId),{uid:u.id,name:u.name||'',email:u.email||'',phone:phoneRaw,code:code,status:'active',createdAt:TS(),expiresAt:exp});
  b.set(db.collection('resetVerify').doc(reqId+'_'+code),{status:'active',email:u.email||'',expiresAt:exp});
  if(markReq)b.set(db.collection('resetRequests').doc(reqId),{status:'ready',processedAt:TS()},{merge:true});
  return b.commit();
}
function processReqs(){
  if(!usersLoaded)return;
  D.reqs.filter(function(r){return r.status==='pending'&&r.createdAt}).forEach(async function(r){
    var hk=r.id+':'+tms(r.createdAt);
    if(handledReq[hk])return; handledReq[hk]=1;
    var k=d10(r.phone),u=D.users.filter(function(x){return d10(x.phone)===k})[0];
    try{
      if(!u){await db.collection('resetRequests').doc(r.id).update({status:'notfound',processedAt:TS()});return}
      await makeResetFor(r.id,r.phone,u,true);
    }catch(x){
      console.error('reset',x);delete handledReq[hk];
      if(Date.now()-lastErrT>8000){lastErrT=Date.now();toast('রিসেট কোড তৈরি হয়নি: '+(x.code||x.message))}
    }
  });
}
var seenReset=null;
function notifyReset(){
  var act=D.resets.filter(function(r){return rState(r)==='active'}).map(function(r){return r.id+':'+r.code});
  if(seenReset!==null&&act.some(function(k){return seenReset.indexOf(k)<0})&&V.tab!=='reset')toast('🔔 নতুন পাসওয়ার্ড রিসেট কোড তৈরি হয়েছে');
  seenReset=act;
}
function vReset(){
  var rows=D.resets.slice(0,60).map(function(r,i){
    var st=rState(r),live=st==='active',kk=r.id+':'+r.code,fresh=!seenRc[kk];seenRc[kk]=1;
    return '<div class="card rc '+(live?'rc-live':'rc-old')+(fresh?' rc-new':'')+'" style="animation-delay:'+(i*60)+'ms"><div class="h"><div><b>'+esc(r.name||'ইউজার')+'</b><small>📱 '+esc(r.phone)+' • '+esc(r.email||'')+'<br>🕒 '+fd(r.createdAt)+'</small></div>'+badge(st)+'</div>'+
    (live?'<div class="rc-code" title="কপি করতে চাপুন" data-rc="copy" data-id="'+r.id+'">'+String(r.code||'').split('').map(function(c,k){return '<span style="animation-delay:'+(k*70)+'ms">'+esc(c)+'</span>'}).join('')+'</div><div class="sm" style="text-align:center">⏳ বাকি: <b data-exp="'+r.id+'">'+leftTxt(r)+'</b></div>':'')+
    '<div class="acts">'+(live?'<a class="btn sm ok" target="_blank" rel="noopener" href="'+esc(waLink(r))+'" style="text-decoration:none">WhatsApp-এ পাঠান</a><button class="btn sm gh" data-rc="copy" data-id="'+r.id+'">কোড কপি</button>':'')+'<button class="btn sm no" data-rc="del" data-id="'+r.id+'">ডিলিট</button></div></div>';
  }).join('');
  var odd=D.reqs.filter(function(r){return r.status==='notfound'||r.status==='pending'}).map(function(r){
    return '<div class="card rc rc-old"><div class="h"><div><b>📱 '+esc(r.phone)+'</b><small>'+fd(r.createdAt)+'</small></div>'+badge(r.status==='pending'?'pending':'notfound')+'</div><div class="acts"><button class="btn sm no" data-rq="del" data-id="'+r.id+'">ডিলিট</button></div></div>';
  }).join('');
  $('main').innerHTML='<div class="bar"><h2>পাসওয়ার্ড রিসেট কোড</h2></div><div class="panel reset-premium"><p style="font-size:13px;line-height:1.8;color:var(--mu)">ইউজার মোবাইল নাম্বার দিয়ে রিসেট চাইলে এখানে (প্যানেল খোলা থাকলে) নিজে থেকেই ৬ সংখ্যার কোড তৈরি হয়। <b>"WhatsApp-এ পাঠান"</b> চাপলে কোডসহ মেসেজ খুলবে — ইউজারকে পাঠান। ইউজার কোড বসিয়ে Verify করলে তার Gmail-এ নতুন পাসওয়ার্ড সেট করার লিংক যাবে। কোড ১৫ মিনিট বৈধ ও একবারই চলে।</p><p style="margin-top:8px;font-size:12.5px;font-weight:700;color:#067647">🟢 অটো-কোড চালু — ইউজার Get OTP চাপলেই এখানে কোড তৈরি হবে (এই প্যানেল খোলা থাকলে)।</p></div><div class="panel"><b>ম্যানুয়াল কোড</b><div class="grid2" style="margin-top:10px"><div class="fld"><input class="inp" id="rcPhone" type="tel" inputmode="tel" placeholder="ইউজারের মোবাইল নাম্বার" value="'+esc(V.rcPhone||'')+'"></div><div class="fld"><button class="btn" id="rcMake" style="width:100%">কোড তৈরি করুন</button></div></div></div>'+
  '<div class="list">'+(rows||'<div class="empty" style="grid-column:1/-1">এখন কোনো রিসেট কোড নেই</div>')+odd+'</div>';
  clearInterval(window.__rcT);
  window.__rcT=setInterval(function(){
    if(V.tab!=='reset'){clearInterval(window.__rcT);return}
    var need=false;document.querySelectorAll('[data-exp]').forEach(function(el){var r=find('resets',el.dataset.exp);if(!r)return;var t=leftTxt(r);el.textContent=t;if(t==='মেয়াদ শেষ')need=true});
    if(need)draw();
  },1000);
}

  $('main').innerHTML='<div class="bar"><h2>Task & Win</h2><button class="btn" id="addTask">＋ নতুন টাস্ক</button></div><div class="panel"><b>টাস্ক তালিকা</b><div class="list" style="margin-top:10px">'+(tasks.map(function(t){return '<div class="card"><b>'+esc(t.title)+'</b><small>'+esc(t.description||'')+' • পুরস্কার ৳'+money(t.reward)+'</small><div class="acts"><button class="btn sm wr" data-task-toggle="'+t.id+'">'+(t.active===false?'চালু':'বন্ধ')+'</button><button class="btn sm no" data-task-del="'+t.id+'">ডিলিট</button></div></div>'}).join('')||'<div class="empty">কোনো টাস্ক নেই</div>')+'</div></div><div class="panel"><b>ইউজারের জমা / অনুমোদন</b><div class="list" style="margin-top:10px">'+(subs.map(function(x){return '<div class="card"><b>'+esc(x.taskTitle||'Task')+'</b><small>'+esc(x.userName||'')+' • '+esc(x.userEmail||'')+' • ৳'+money(x.reward)+'</small><small>কাজের বিবরণ: '+esc(x.experience||'বিবরণ দেওয়া হয়নি')+'</small><small>স্ট্যাটাস: '+esc(x.status||'pending')+'</small>'+(x.status==='pending'?'<div class="acts"><button class="btn sm ok" data-sub-approve="'+x.id+'">Approve + Balance</button><button class="btn sm no" data-sub-reject="'+x.id+'">Reject</button></div>':'')+'</div>'}).join('')||'<div class="empty">কোনো জমা নেই</div>')+'</div></div>';
}
$('main').addEventListener('click',async function(e){
 if(e.target.id==='addTask')return form('নতুন টাস্ক',[{k:'title',label:'টাস্কের নাম',req:1},{k:'description',label:'কী করতে হবে',type:'textarea'},{k:'reward',label:'পুরস্কার (৳)',type:'number',req:1},{k:'order',label:'ক্রম',type:'number'},{k:'active',label:'চালু থাকবে',type:'checkbox'}],{title:'',description:'',reward:'',order:D.tasks.length+1,active:true},async function(v){await db.collection('tasks').add({title:v.title.trim(),description:v.description.trim(),reward:Number(v.reward)||0,order:Number(v.order)||0,active:!!v.active,createdAt:TS()});toast('টাস্ক যোগ হয়েছে')});
 var t=e.target.closest('[data-task-toggle]');if(t){var x=find('tasks',t.dataset.taskToggle);if(x)await db.collection('tasks').doc(x.id).update({active:x.active===false});return}
 var d=e.target.closest('[data-task-del]');if(d){if(confirm('টাস্ক ডিলিট করবেন?'))await db.collection('tasks').doc(d.dataset.taskDel).delete();return}
 var ap=e.target.closest('[data-sub-approve]');if(ap){var sub=find('taskSubs',ap.dataset.subApprove);if(!sub||sub.status!=='pending')return;if(!confirm('৳'+money(sub.reward)+' ব্যালেন্সে যোগ করবেন?'))return;var bt=db.batch();bt.update(db.collection('taskSubmissions').doc(sub.id),{status:'approved',reviewedAt:TS()});bt.set(db.collection('users').doc(sub.uid),{balance:INC(Number(sub.reward)||0)},{merge:true});await bt.commit();toast('অনুমোদিত; ব্যালেন্স যোগ হয়েছে');return}
 var r=e.target.closest('[data-sub-reject]');if(r){await db.collection('taskSubmissions').doc(r.dataset.subReject).update({status:'rejected',reviewedAt:TS()});toast('জমা বাতিল হয়েছে')}
});

// ---------- settings ----------
var SF=[['websiteName','ওয়েবসাইটের নাম','text'],['notice','নোটিশ (সাইট খুললে পপআপে দেখায়)','textarea'],['telegramChannel','Telegram চ্যানেল লিংক','text'],['telegramGroup','Telegram গ্রুপ লিংক','text'],['youtube','YouTube লিংক','text'],['howTo','"কিভাবে অর্ডার করবেন" ভিডিও লিংক (সব ক্যাটাগরির জন্য)','text'],
  ['bkash','bKash নাম্বার','text'],['nagad','Nagad নাম্বার','text'],['rocket','Rocket নাম্বার','text'],['minDeposit','সর্বনিম্ন ডিপোজিট (৳)','number'],['categorySectionTitle','হোম পেজ ক্যাটাগরি শিরোনাম','text'],['referralAmount','রেফার প্রতি নির্দিষ্ট পুরস্কার (৳)','number'],['referralPercent','রেফার কমিশন (%)','number'],['referralText','রেফার প্রোগ্রামের লেখা','textarea']];
function vSet(){
  var s=D.settings;
  $('main').innerHTML='<div class="bar"><h2>সেটিংস</h2></div><div class="panel"><div class="grid2">'+SF.map(function(f){
    var v=s[f.k===undefined?f[0]:f[0]]; v=(v==null?'':v);
    return '<div class="fld" '+(f[2]==='textarea'?'style="grid-column:1/-1"':'')+'><label>'+f[1]+'</label>'+(f[2]==='textarea'?'<textarea class="inp" id="s_'+f[0]+'">'+esc(v)+'</textarea>':'<input class="inp" id="s_'+f[0]+'" type="'+f[2]+'" value="'+esc(v)+'">')+'</div>';
  }).join('')+'</div><button class="btn" id="saveSet">সেভ করুন</button></div>'+
  '<div class="panel"><h3 style="margin-bottom:4px">🖼️ লোগো সেটিংস</h3><p style="font-size:12px;color:var(--mu);margin-bottom:12px;line-height:1.7">ছবি বাছাই করলেই সাথে সাথে সেভ হবে এবং সাইটে আপডেট হবে। ফাঁকা রাখলে ডিফল্ট দেখাবে (গোল লোগোর জন্য "H")।</p><div class="logo-grid">'+LOGOS.map(function(l){
    var u=s[l[0]]||'';
    return '<div class="logo-box"><b>'+l[1]+'</b><div class="logo-prev'+(l[2]?' round':'')+'">'+(u?'<img src="'+esc(u)+'" alt="">':'ছবি নেই')+'</div><div class="acts"><button class="btn sm" type="button" data-logo-pick="'+l[0]+'">'+(u?'পরিবর্তন':'যোগ করুন')+'</button>'+(u?'<button class="btn sm no" type="button" data-logo-del="'+l[0]+'">মুছুন</button>':'')+'</div><input type="file" accept="image/*" hidden data-logo-file="'+l[0]+'"></div>';
  }).join('')+'</div></div>';
}
var LOGOS=[['logoBkash','bKash লোগো',0],['logoNagad','Nagad লোগো',0],['logoRocket','Rocket লোগো',0],['logoRound','গোল লোগো (লোডিং ও পেমেন্ট পেজ)',1]];
function shrinkLogo(file,max){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
  var k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
  var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
  var out=c.toDataURL('image/png');
  if(out.length>160000){var c2=document.createElement('canvas');c2.width=w;c2.height=h;var x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);out=c2.toDataURL('image/jpeg',.86)}
  res(out)};im.src=r.result};r.readAsDataURL(file)})}
$('main').addEventListener('click',async function(e){
  var pk=e.target.closest('[data-logo-pick]');if(pk){var f=$('main').querySelector('[data-logo-file="'+pk.dataset.logoPick+'"]');if(f)f.click();return}
  var dl=e.target.closest('[data-logo-del]');if(dl){if(!confirm('এই লোগো মুছে ফেলবেন?'))return;try{var o={updatedAt:TS()};o[dl.dataset.logoDel]=firebase.firestore.FieldValue.delete();await db.collection('settings').doc('site').set(o,{merge:true});toast('লোগো মোছা হয়েছে')}catch(x){toast('সমস্যা: '+(x.code||x.message))}}
});
$('main').addEventListener('change',async function(e){
  var f=e.target.closest('[data-logo-file]');if(!f)return;var file=f.files&&f.files[0];if(!file)return;
  if(!/^image\//.test(file.type)){toast('শুধু ছবি নির্বাচন করুন');f.value='';return}
  if(file.size>8*1024*1024){toast('ছবি ৮MB এর কম হতে হবে');f.value='';return}
  toast('আপলোড হচ্ছে...');
  try{var url=await shrinkLogo(file,f.dataset.logoFile==='logoRound'?256:200);var o={updatedAt:TS()};o[f.dataset.logoFile]=url;await db.collection('settings').doc('site').set(o,{merge:true});toast('✅ লোগো সেভ হয়েছে — সাইটে সাথে সাথে আপডেট হবে')}
  catch(x){console.error(x);toast('সেভ হয়নি: '+(x.code||x.message||''))}
  f.value='';
});
$('main').addEventListener('click',async function(e){
  if(e.target.id!=='saveSet') return; var o={};
  SF.forEach(function(f){var v=$('s_'+f[0]).value; o[f[0]]=f[2]==='number'?(Number(v)||0):v.trim()});
  o.updatedAt=TS(); e.target.disabled=true;
  try{await db.collection('settings').doc('site').set(o,{merge:true});toast('✅ সেটিংস সেভ হয়েছে — সাইটে সাথে সাথে আপডেট হবে')}catch(x){toast('সমস্যা: '+(x.code||x.message))}
  e.target.disabled=false;
});

// ---------- generic form modal ----------
function form(title,fields,init,onSave){
  var h='<h3>'+esc(title)+'</h3>'+fields.map(function(f){
    var v=init[f.k], id='f_'+f.k, t=f.type||'text';
    var inp=t==='textarea'?'<textarea class="inp" id="'+id+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>':
      t==='select'?'<select class="inp" id="'+id+'">'+f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>':
      t==='checkbox'?'<label class="ck"><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'>'+esc(f.label)+'</label>':
      '<input class="inp" id="'+id+'" type="'+t+'" '+(t==='number'?'step="any" ':'')+'placeholder="'+esc(f.ph||'')+'" value="'+esc(v)+'">';
    return '<div class="fld">'+(t==='checkbox'?'':'<label for="'+id+'">'+esc(f.label)+'</label>')+inp+(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
  }).join('')+'<p class="err" id="fErr"></p><div class="acts"><button class="btn gh" type="button" id="fNo">বন্ধ করুন</button><button class="btn" type="button" id="fOk">সেভ</button></div>';
  $('box').innerHTML=h; $('mask').classList.add('show');
  $('fNo').onclick=function(){$('mask').classList.remove('show')};
  $('fOk').onclick=async function(){
    var v={}; for(var i=0;i<fields.length;i++){var f=fields[i],el=$('f_'+f.k); v[f.k]=(f.type==='checkbox')?el.checked:el.value; if(f.req&&!String(v[f.k]).trim()){$('fErr').textContent='"'+f.label+'" দিন';return}}
    this.disabled=true;
    try{await onSave(v);$('mask').classList.remove('show')}catch(x){console.error(x);$('fErr').textContent=x.message&&!x.code?x.message:('সমস্যা: '+(x.code||x.message))}
    this.disabled=false;
  };
}
$('mask').addEventListener('click',function(e){if(e.target===$('mask'))$('mask').classList.remove('show')});
}
